[debug]
# filename of the debug log file (path specification possible)
debugfile=slftp.log
# set to 1 to flush each log line to disk immediately, preventing truncated entries on crash
flushlines=0
# log verbosity level: 0=errors only, 1=errors and general messages, 2=all (spam), 3=no logging
verbosity=0
# comma-separated debug category filter, e.g. taskrace,pazo,kb - or 'verbose' to log everything
# must match exactly the section constant used in Debug() calls in the source code
categories=verbose
# set to a value >0 to enable event-based lock timeout (in ms) for deadlock debugging
# raises an exception with thread and code location info when a lock is held longer than the timeout
# WARNING: Enabling this can cause thread crashes and data loss (e.g. missed announces). Use with extreme caution!
# (debugunit.pas / slcriticalsection2.pas)
event_based_locking_timeout=0
# set to 1 to record lock wait and hold durations per lock; results accessible via !loglockstats
# only works when event_based_locking_timeout is set to a value greater than 0
# NOTE: Stability risks from the timeout mechanism persist even if monitoring is set to 0.
monitor_lock_times=0

[http]
# NOTE: these values are written by the IRC command !setsocks5 HTTP for persistence only
# the HTTP subsystem (http.pas) currently does NOT read these values to route requests through a proxy
# set to 1 to use a socks5 proxy for outbound HTTP requests (IMDB, TVMaze, etc.)
enabled=0
# name of the socks5 proxy entry to use for HTTP; must match a proxy configured in [socks5]
proxyname=

[console]
# width of the ncurses console window in columns after initialization
width=200
# height of the ncurses console window in rows after initialization
height=60
# maximum number of lines to retain in the main console text buffer
maxlines=1000
# maximum number of lines to retain in the command input history buffer
history_maxlines=100
# optional custom string appended to the console window title bar; leave empty for default
customtitle=
# set to 1 to prepend timestamps [hh:nn:ss] to each line printed to the console
add_time_stamp=0
# set to 1 to disable raw-log console windows for site slots and IRC channels (reduces CPU load)
no_console_msg=1
# set to 1 to disable the queue overview console window
no_console_queue=1
# set to 1 to disable the slot overview console window
no_console_slot=1
# set to 1 to display an uptime counter in the upper-left corner of the console
show_uptime=0
# set to 1 to display KB, IRC, RULES and STATS statistics at the bottom-right corner of the console
show_infos=0

[ident]
# set to 1 to enable the RFC 1413 ident server on port 113
# NOTE: on Unix systems binding ports below 1024 requires root privileges
enabled=0
# default ident reply string returned to ident requests; can be overridden per site slot
response=slftpuser

[sites]
# maximum idle time in seconds before dropping a site connection (0=unlimited; do not abuse)
maxidle=60
# interval in seconds between idle keep-alive commands sent to a connected site
idleinterval=25
# maximum number of relogin attempts before marking the site as down
maxrelogins=3
# set to 1 to automatically log in to all enabled sites on startup
autologin=0
# set to 1 to route all site FTP connections through the global socks5 proxy (see [socks5])
socks5=0
# flood control: minimum delay in milliseconds between consecutive outbound site connections
delay_between_connects=200
# set to 1 to automatically mark a site as down when it reports out-of-credits on login
set_down_on_out_of_credits=0
# set to 1 to automatically mark a site as down when it reports out-of-disk-space on login
set_down_on_out_of_space=1
# number of failed relogins after which slftp sends !username to kill ghost connections (0=disabled)
killafter=0
# set to 1 to kill ghost connections on startup (first login on slot 0 only)
kill_ghosts_on_startup=1
# set to 1 to split site configuration into one file per site under rtpl/ directory
# WARNING: this operation is irreversible and splits the unified data into separate files
split_site_data=0
# internal site name used for IMDB, TVMaze and other HTTP lookup tasks
admin_sitename=SLFTP
# number of parallel task slots available for the internal admin site (IMDB, TVMaze lookups, etc.)
admin_siteslots=10

[socks5]
# set to 1 to enable the global socks5 proxy (used by site connections and IRC if configured)
enabled=0
# socks5 proxy hostname or IP address
host=127.0.0.1
# socks5 proxy port
port=11101
# if you want anonymous socks5, blank username and password fields below:
username=user
password=pw

[irc]
# set to 1 to route all IRC connections through the global socks5 proxy (see [socks5])
socks5=0
# set to 1 to mangle the local hostname to prevent IP leaking during IRC login
manglehost=1
# delay in seconds before attempting to reconnect to IRC after a connection error
sleep_on_error=30
# default nickname for IRC connections
nickname=slftp
# alternative nickname used if the primary nickname is already in use
anickname=slftp_
# username (ident) for IRC connections
username=slftp
# real name field for IRC connections
realname=slftp
# timeout in seconds for IRC activity; connection is dropped if no data is received
timeout=1800
# command prefix for bot commands in IRC (e.g. !help)
cmdprefix=!
# timeout in seconds for the IRC registration (login) sequence
register_timeout=70
# set to 1 to echo nickname change events to the console
echo_nick_change_events=0
# set to 1 to echo topic change events to the console
echo_topic_change_events=0
# set to 1 to echo join/part events to the console
echo_join_part_events=0
# set to 1 to echo kick events to the console
echo_kick_events=0
# set to 1 to echo all IRC activity directly to the console (verbose)
direct_echo=0
# set to 1 to forward all private messages received by the bot to the bot admin(s)
admin_forward_msgs=1

[news]
# interval in hours for showing info line if there are unread news
new_news_announce_interval=3

[timeout]
# default timeout in seconds for outbound TCP connections
connect=20
# default timeout in seconds for general I/O operations
io=20

[tags]
# regular expression for identifying completed release directory tags in dirlistings
# (?<complete>) capture group is NOT required, but the regex must match common patterns
# example: 100%, - COMPLETE -, (DONE -> 12F)
complete_regex=([^\w]*100%[^\w]*)|([^\w]*-\sCOMPLETE\s\)[^\w]*)|([^\w]*-\sCOMPLETE\s-[^\w]*)|([^\w].*DONE\s\-\>\s\d+F[^\w]*)|((\dM\s*\dF.*?|\d+[\w]*[^\w]*\d+[\w]*[^\w]*)(DONE|COMPLETE$|FINISH)|(\d+F[^\w].*DONE)|COMPLETE\-\d+M\_\d+F|Completed!.*?\d+)|(\s+\d+F[^\w]*-\sCOMPLETE\s\])
# regular expression for identifying incomplete release directory tags in dirlistings
incomplete_regex=(\d{1,2}\s*%\s*Complete|incomplete|\d{1,2}%|\-\s*\d{1,2}DONE)

[spread]
# interval in seconds for announcing new releases to other linked slftp instances (spread channel)
announcetime=20

[kb]
# interval in seconds for persisting the knowledge base (slftp.kb) to disk (0=disabled)
kb_save_entries=0
# number of seconds to retain releases in the knowledge base (default: 604800 = 7 days)
kb_keep_entries=604800
# comma-separated list of section name masks that trigger the MP3Source/MP3Genre/MP3Type rules
TMP3Release=MP3,MP3-*,FLAC,ABOOK
# comma-separated list of section name masks that trigger the 0daySource rule
T0dayRelease=0DAY,PDA
# comma-separated list of section name masks that trigger the NFO-only rule
TNFORelease=*X265*
# comma-separated list of section name masks that trigger the IMDB lookup and rules
# supports wildcards (*) and /regex/ delimiters
TIMDBRelease=/(GER720P|GER1080P|ENG720P|ENG1080P)/,*X264SD,BLURAY*
# comma-separated list of section name masks that trigger the TVMaze (TV info) lookup and rules
TTVRelease=ENGTV*,ENGTV720P*,ENGTV1080P*
# comma-separated list of section name masks that trigger the MVID/Music Video rules
TMVIDRelease=MVID*,MDVDR*,MBLURAY*
# space-separated list of allowed MP3 languages; used by the mp3language rule
mp3languages=AA AB AF AL AM AR AS AY AT AZ BA BE BG BH BI BN BO BR BY CA CG CH CN CO CV CS CY CZ DA DE DD DK DZ EE EH EL EN EO ES ET EU FA FI FJ FO FR FY GA GD GL GN GU GR HA HE HI HL HR HU HY HT IA IE IK IL IN IS IT IW JA JI JP JW KA KK KL KM KN KO KR KS KU KY LA LB LN LO LT LV LU MA MG MI MK ML MN MO MR MS MT MY MX NA NE NG NL NO OC OM OR PA PH PL PS PT QU RE RM RN RS RO RU RW SA SD SE SG SH SI SK SL SM SN SO SP SQ SR SS ST SU SY SV SW TA TE TG TH TI TK TL TN TO TR TS TT TW UA UR UZ VI VO WO XH YO YU ZA ZH ZU ZW CAT CRO DUTCH SLO SYR ESP
# space-separated 0day release tags indicating a Windows platform; used by the 0daysource rule
0daysource_WIN=Win Win32 Win64 Windows WinXP WinCE WinALL
# space-separated 0day release tags indicating a Linux platform; used by the 0daysource rule
0daysource_LINUX=Linux LNX Linux64 LNX64
# space-separated 0day release tags indicating a Unix/BSD platform; used by the 0daysource rule
0daysource_UNIX=BSD FreeBSD OpenBSD NetBSD Solaris SunOS FREEBSD7 UnixAll
# space-separated 0day release tags indicating a macOS platform; used by the 0daysource rule
0daysource_MAC=MAC MACOSX OSX MACOS
# space-separated 0day release tags indicating a NAS device platform; used by the 0daysource rule
0daysource_NAS=QNAP Synology
# space-separated 0day release tags indicating an Android platform; used by the 0daysource rule
0daysource_ANDROID=Android
# space-separated 0day release tags indicating an iOS/iPhone platform; used by the 0daysource rule
0daysource_IOS=iOS iPhone iPod iPad
# set to 1 to enable automatic completion of incomplete releases by fetching from another site
enable_try_to_complete=0
# number of seconds to wait after a release is detected as incomplete before attempting completion
try_to_complete_after=450
# set to 1 to restrict completion attempts to sites that have routing rules configured
only_use_routable_sites_on_try_to_complete=1
# set to 1 to skip MP3 genre extraction from dirlist (disables genre tagging for MP3 releases)
nomp3dirlistgenre=0
# set to 1 to skip NFO genre extraction from dirlist (disables genre tagging for NFO-based releases)
nonfodirlistgenre=0
# set to 1 to skip MVID genre extraction from dirlist (disables genre tagging for MVID releases)
nomvdirlistgenre=0
# set to 1 to check whether a new release is a renamed variant of a known group name in the KB
renamed_group_checker=1
# set to 1 to check whether a new release is a trimmed/cut version of an existing release in the KB
trimmed_shit_checker=1
# set to 1 to check whether a new release has been renamed from another known release in the KB
renamed_release_checker=1
# set to 1 to strip the INTERNAL tag from the group name before checking against the known groups list
remove_internal_tag_on_knowgroup=0
# set to 1 to strip the WEB tag from the group name before checking against the known groups list
remove_web_tag_on_knowgroup=0
# set to 1 to automatically add the releasing group as an affiliate to the destination site on PRE detection
auto_add_affils=1
# set to 1 to skip processing of ripped releases (based on pre time) that are older than 30 days
skip_rip_older_then_one_month=1

[fake]
# set to 1 to enable generic fake release detection for all sections not explicitly configured
# NOTE: per-section fake settings follow the pattern fake_SECTIONNAME_<key>, e.g. fake_MP3_enabled=1
# the double underscore (fake__*) means the section name is empty, serving as the global default
fake__enabled=1
# minimum release name length; releases shorter than this are flagged as fake
fake__min_release_length=10
# upper threshold for different character count; releases at or below this are flagged as fake
fake__few_different_chars=6
# lower threshold for different character count; releases at or above this are flagged as fake
fake__many_different_chars=40
# maximum number of dot characters; releases with this many or more dots are flagged as fake
fake__many_dots=15
# a word is considered short if its length is less than or equal to this value
fake__many_short_words_length=2
# minimum number of short words that triggers the fake flag
fake__many_short_words_count=6
# space-separated list of banned words; a release containing any of these is flagged as fake
fake__banned_words=scene test pretest pre auto deluser keke hehe "april 1" Robot Trader Deleted childporn
# minimum number of vowels in the release name that triggers the fake flag
fake__many_vocal=30
# NOTE: to configure fake detection specifically for MP3 sections, use fake_MP3_enabled, fake_MP3_many_dots, etc.

[midnight]
# comma-separated list of section name masks that are treated as midnight sections (sent to day directories)
sections=MP3-*, 0DAY, PDA, /(A|E)BOOK/i, XXXPIX, MV
# start of the midnight window in CET (HH:MM); tweak to represent your local CET equivalent
starts=23:45
# end of the midnight window in CET (HH:MM)
ends=00:15

[autodirlist]
# maximum age in seconds for a rip to be eligible for addition to the KB (default: 86400 = 1 day)
dropolder=86400
# delay in seconds before sending SITE REQFILLED to the site after a request is detected as complete
reqfill_delay=60
# set to 1 to fall back to comparing file counts between source and destination when no complete tag is present
compare_files_for_reqfilled_fallback=1
# set to 1 to restrict request filling to sites that have routing rules configured
only_use_routable_sites_on_reqfill=0
# set to 1 to use the SITE SEARCH command to locate sources for request filling
use_site_search_on_reqfill=0
# set to 1 to fill requests that are already present on the destination site
fill_already_on_site=0
# set to 1 to create a directory hint (Already_on_site_in_<path>) when a request is already on the site
create_already_on_site_in_directory=1

[speedstats]
# interval in seconds for saving speed statistics to disk (default: 900 = 15 minutes)
save_interval=900
# interval in seconds for recalculating site routes based on speed statistics (default: 3600 = 1 hour)
recalc_routes_interval=3600
# maximum number of speed stat entries retained in memory; oldest entries are removed when exceeded
max_entries=5000
# minimum file size in bytes for a transfer to be recorded in speed statistics
min_filesize=5000000
# set to 1 to prevent speed statistics from changing site upload priority across different rank tiers
# ordering is only adjusted within the same rank; use !reducedspeedstatweight to override per site
reduced_speedstat_weight=0

[speedtest]
# interval in seconds for announcing upload speed during a speedtest (in IRC)
announce_interval=20
# unique suffix appended to speedtest filenames to prevent conflicts with other slftp instances
speedtest_filename_suffix=lamer
# size in megabytes of the file generated for local-to-site upload speed testing
local_upload_mb=50
# minimum file size in megabytes when selecting an existing file on a site for speed testing
min_filesize=15
# maximum file size in megabytes when selecting an existing file on a site for speed testing
max_filesize=120

[indexer]
# regular expression pattern used to identify NFO files during indexing
expect_nfo_files=liste?\.nfo
# filename of the indexer SQLite database
database=indexes.db
# maximum directory recursion depth for the auto-indexer
max_deep=5
# set to 1 to use the custom LIST command below instead of the default FTP LIST command
use_custom_dirlist_command=0
# custom FTP LIST command used for indexing when use_custom_dirlist_command is set to 1
custom_dirlist_command=list -al

[stats]
# set to 1 to enable the transfer statistics database
enabled=1
# filename of the statistics SQLite database
database=stats.db
# minimum file size in bytes for a transfer to be recorded in the statistics database
min_filesize=100000
# number of days after which statistics entries are deleted from the database (0=keep indefinitely)
delete_after_days=0

[backup]
# directory path where backup TAR files are saved; can be an absolute path outside the slftp directory
backup_dir=backup
# set to 1 to automatically create a backup on slftp startup
run_backup_on_startup=1
# maximum number of backup files to retain; oldest backups are deleted when this limit is exceeded
keep_backups=10
# interval in seconds between automatic backups (0=disabled)
backup_interval=0
# comma-separated list of filenames to exclude from all backups
skipfiles=

[ranks]
# minimum percentage of configured sites that must be involved in a race for rank points to be awarded
# example: with 10 MP3 sites and percent_of_sites_to_score=30, a race on 3 sites earns points
# but a race on only 2 sites (20%) does not score
percent_of_sites_to_score=30
# interval in seconds for saving rank data to disk
save_interval=900
# interval in seconds for recalculating site ranks from accumulated race statistics
recalc_ranks_interval=1800

[taskrace]
# timeout in seconds: if the dirlist shows no new files for this duration, the race task is abandoned
newdir_max_unchanged=300
# timeout in seconds: if the dirlist remains empty for this duration, the race task is abandoned
newdir_max_empty=300
# timeout in seconds: after the release is complete, continue dirlisting for at most this duration
newdir_max_completed=300
# timeout in seconds: after directory creation, abandon the race if no activity occurs within this duration
newdir_max_created=600
# delay in milliseconds before re-queuing a dirlist task after the previous one completes
newdir_dirlist_readd=100
# when enabled, newdir_dirlist_readd is dynamically increased based on system load average
# threshold defaults to number of CPU cores (e.g. 4.0 on a 4-core system)
# at load == threshold: delay doubles; at load+1: triples; at load+2: quadruples, etc.
newdir_dirlist_readd_load_enabled=0
newdir_dirlist_readd_load_threshold=4.0
# optional: explicit step values instead of the formula above.
# comma-separated list: first value = at threshold, second = threshold+1, third = threshold+2, etc.
# if the load exceeds the highest step, the last value is used.
# example with threshold=4.0 and base=100ms: 200,300,500,1000 means:
#   load < 4.0   -> 100ms (base)
#   load 4.0-4.9 -> 200ms
#   load 5.0-5.9 -> 300ms
#   load 6.0-6.9 -> 500ms
#   load 7.0+    -> 1000ms
# leave empty to use the formula (newdir_dirlist_readd * (load - threshold + 2))
newdir_dirlist_readd_load_steps=
# maximum number of CRC-bad transfer events from a source site before dirlists from it are stopped for this race
badcrcevents=15
# set to 1 to convert all upload filenames to lowercase before issuing the FTP STOR command
convert_filenames_to_lowercase=1
# set to 1 to automatically add a skip rule for a group when a site rejects a MKDIR with 'BANNED' or 'not accepted here'
autoruleadd=1
# single section name mask (wildcards and /regex/ supported) for which SFV verification is enforced
# only files whose extension matches the type listed in the SFV will be transferred if present in the SFV
# NFO, JPG and similar files with non-matching extensions are always exempt
# examples: MP3-*  or  /(MP3|0DAY|APPS)/i  (only ONE mask, comma-separated list does NOT work)
SFVRelease=
# timeout in seconds for stalled transfers (no data received); kills the connection and posts to the ERROR channel
# set to 0 to disable; use !killconnectiononstalledtransfer to override per site
kill_connection_on_stalled_transfer_seconds=0
# set to 1 to also display completion times relative to race start alongside the per-site relative times
show_complete_time_stats=0

[taskgenredirlist]
# maximum number of attempts to extract the genre from the release dirlist
readd_attempts=5
# wait time in seconds between genre-from-dirlist retry attempts
readd_interval=3

[taskgenrenfo]
# maximum number of attempts to download a release NFO for genre extraction
readd_attempts=5
# wait time in seconds between genre-NFO retry attempts
readd_interval=3

[taskmvid]
# maximum number of attempts to download a MVID release NFO or SFV (applied separately to each)
readd_attempts=5
# wait time in seconds between MVID NFO retry attempts
readd_interval=3

[taskgame]
# maximum number of attempts to download a game release NFO
readd_attempts=5
# wait time in seconds between game NFO retry attempts
readd_interval=3

[tasksitenfo]
# maximum number of attempts to download an NFO file from a site
readd_attempts=5
# wait time in seconds between site NFO retry attempts
readd_interval=3

[dbaddimdb]
# set to 1 to announce IMDB lookup results to IRC after a successful fetch
post_lookup_infos=1
# set to 1 to skip IMDB lookups for TV releases (TV releases are handled by the TVMaze subsystem)
skip_tv_releases=1
# set to 1 to fetch screen count data from Box Office Mojo for Wide/Limited/STV classification
# adds approximately 5-6 seconds to each IMDB lookup
enable_boxofficemojo_lookup=0

[taskimdb]
# maximum number of attempts to fetch IMDB data when the release NFO is not yet available
readd_attempts=5
# wait time in seconds between IMDB NFO retry attempts
readd_interval=3

[tasktvinfo]
# filename of the TVMaze SQLite database used to cache TV show information
database=tvinfos.db
# number of days after TV show data is considered stale and will be refreshed on next lookup
days_between_last_update=6
# set to 1 to announce TVMaze lookup results to IRC after a successful fetch
post_lookup_infos=0
# maximum number of attempts to fetch TV show data when the show is not yet in the local database
readd_attempts=3
# wait time in seconds between TVMaze lookup retry attempts
readd_interval=3
# IRC command prefix used when echoing TVMaze additions back to the channel (e.g. from sitebot announces)
addcmd=!addtvmaze
# maximum number of results returned by the !addtvinfo -s search command
max_sid_lookup_results=3
# set to 1 to abort TV info processing if the alphanumeric character overlap check between release name and TVMaze data fails
stop_on_englishcheck=0
# set to 1 to use the new-style IRC announce format; set to 0 for the legacy dot-separated format
use_new_announce_style=1

[taskidle]
# comma-separated list of FTP commands sent to a site when idle to maintain the connection
# one command is selected at random per idle interval; standard keep-alive sequence shown below
idlecommands=REST 0,PASV,CWD .

[queue]
# set to 1 to enable periodic cleanup of stale tasks from the queue
enable_queueclean=0
# interval in seconds between queue cleanup runs (read from mainthread.pas)
queueclean_interval=600
# age in seconds after which an unassigned task is removed during queue cleanup
queueclean_unassigned=600
# age in seconds after which a long-running assigned task is removed during queue cleanup
queueclean_maxrunning=900
# maximum number of task assignment attempts before a task is deferred
maxassign=200
# delay in seconds between consecutive task assignment retry attempts
maxassign_delay=15
# interval in milliseconds for the queue scheduler timer (read from mainthread.pas)
queue_fire=900
# upload sort priority for sample subdirectories: 0=no sorting, 1=upload first, 2=upload last, 3=only when nothing else is running
sample_dirs_priority=1
# upload sort priority for proof subdirectories: 0=no sorting, 1=upload first, 2=upload last, 3=only when nothing else is running
proof_dirs_priority=2
# upload sort priority for cover subdirectories: 0=no sorting, 1=upload first, 2=upload last, 3=only when nothing else is running
cover_dirs_priority=2
# upload sort priority for subs subdirectories: 0=no sorting, 1=upload first, 2=upload last, 3=only when nothing else is running
subs_dirs_priority=2
# upload sort priority for image files (e.g. .jpg, .png): 0=no sorting, 1=upload first, 2=upload last, 3=only when nothing else is running
image_files_priority=2
# upload sort priority for video files (e.g. .avi, .mkv): 0=no sorting, 1=upload first, 2=upload last, 3=only when nothing else is running
video_files_priority=2

[taskpretime]
# pretime lookup mode: 0=disabled, 1=HTTP script, 2=MySQL/MariaDB database, 3=SQLite database
mode=0
# secondary pretime lookup mode used as fallback when the primary mode fails (same values as mode)
mode_2=0
# maximum number of pretime check retry attempts
readd_attempts=5
# wait time in seconds between pretime check retry attempts
readd_interval=3
# global default maximum pretime in seconds; releases older than this value are not raced
default_pretime=600
# URL of the PHP pretime lookup script; %s is substituted with the release name
# the script must return an empty page for unknown releases
#url=http://127.0.0.1/pretime.php?text=%s
# regular expression to parse the HTTP pretime script response
# must contain the named capture group (?<pretime>\d+) matching the Unix timestamp
#regexp=

[dirlist]
# regular expression for filenames to exclude from dirlist processing (these files are never traded)
global_skip_files=^(tvmaze|imdb)\.nfo$|\-missing$|\-offline$|^\.|^file\_id\.diz$|\.htm$|\.html|\.bad$|\[IMDB\]\W+
# regular expression for directory names to exclude from dirlist processing (these dirs are never traded)
global_skip_dirs=\[IMDB\]\W+|\[TvMaze\]\W+
# handling of incomplete (being-uploaded) files encountered in a dirlist:
# 0=skip only 0-byte files, 1=skip 0-byte and in-progress files (glFTPd only; others treated as complete), 2=skip nothing
skip_being_uploaded_files=0

[precatcher]
# set to 1 to enable recursive section mapping in the precatcher
recursiv_mapping=1
# set to 1 to enable verbose debug logging for precatcher IRC parsing
precatcher_debug=0
# filename for the precatcher debug log (only written when precatcher_debug=1)
debugfile=precatcher.log

[dbaddpre]
# comma-separated IRC commands recognized as pre-add triggers (e.g. from sitebot announces)
addprecmd=!addpre,!sitepre
# IRC command used by slftp to echo pre entries back to the sitebot channel
addpreechocmd=!sitepre
# filename of the SQLite on-disk database for pre entries (only used when mode=1)
db_file=db_addpre.db
# pre entry storage backend: 0=SQLite in-memory, 1=SQLite on-disk, 2=MySQL/MariaDB
mode=0
# set to 1 to add a release to the knowledge base and start racing when a pre entry is inserted
add_to_kb_on_dbaddpre_insert=0

[mysql]
# MySQL or MariaDB server hostname or IP address; set to 0 to disable MySQL/MariaDB support entirely
host=0
# MySQL or MariaDB server port
port=3306
# database authentication username
user=dbuser
# database authentication password
pass=dbpass
# name of the database containing the addpre table
dbname=slftp-addpre
# database management system type; valid values: MySQL, MariaDB
dbms=

[taskmysqlpretime]
# name of the table containing pre entries in the MySQL/MariaDB database
tablename=addpre
# column name for the release name field
rlsname_field=rls
# column name for the release section field
section_field=section
# column name for the pre timestamp field (Unix timestamp)
rlsdate_field=ts
# column name for the source/origin info field; set to -1 if this column does not exist
source_field=-1

[prebot]
# delay in seconds before re-checking the predir after executing a pre command
# if the release is still present in the predir after this delay, a warning is posted to IRC
# the next batch queue entry only starts after this delay has elapsed
predir_re_examine_time=5

# =============================================================================
# [eprecatcher] - External Pre-Catcher (UDP listener)
# =============================================================================
# Listens on a UDP port for external pre-announce messages from a pre-bot.
# Messages are parsed and injected directly into the KB as if they were IRC announces.
# Read in eprecatcher.pas.
[eprecatcher]
# set to 1 to enable the external pre-catcher UDP listener (default: False)
enabled=0
# IP address or hostname to bind the UDP listener to (empty = all interfaces)
bindhost=
# UDP port to listen on for external pre-announce messages (default: 16666)
bindport=16666

[api]
# set to 1 to enable the REST API server (required for Web UI)
enabled=0
# port number for the API server to listen on
port=8089
# IP address to bind the API server to (e.g. 127.0.0.1 for local access only)
host=127.0.0.1
# API key required for authentication (leave empty to disable authentication - NOT RECOMMENDED)
apikey=

[UDPConfig]
# Master switch for cbftp integration (0/1/true/false, default: 0)
# Enables both UDP race notifications and REST API proxy (/api/cbftp/*)
EnableUDP=0
# Hostname or IP where cbftp is running (default: 127.0.0.1, used for both UDP and HTTPS)
IP=127.0.0.1
# UDP port for one-way race notifications sent as raw datagrams (default: 5696)
# Plaintext payload format: <Password> race <section> <rlsname> <site1,site2,...>
# Encrypted: AES-256-CBC with Salted__ header, PBKDF2-HMAC-SHA256 key derivation (10000 iter)
Port=5696
# Encrypt UDP payload with AES-256-CBC to match cbftp's default encrypted mode (0/1, default: 1)
# Set to 0 only if cbftp is configured with UDP mode = Plaintext
EncryptUDP=1
# HTTPS port of cbftp's REST API (self-signed cert accepted, default: 55477)
# Proxied via /api/cbftp/* endpoints: sites, sections, spreadjobs, transferjobs, raw, info
ApiPort=55477
# Shared secret for both UDP payload prefix and HTTP Basic Auth with empty username (default: empty)
Password=
