/* Test server of the unrealircd skill: only reachable on 127.0.0.1, without flood limits, so that a
 * test client can send bursts. Never use this config for a server that others can reach. */

include "modules.default.conf";
include "help/help.conf";
include "operclass.default.conf";
include "snomasks.default.conf";
loadmodule "cloak_sha256";

/* drops messages above a rate per channel */
blacklist-module targetfloodprot;

me {
	name "irc.slftp.test";
	info "slFtp test server";
	sid "001";
}

admin {
	"slFtp test server";
}

class clients {
	pingfreq 90;
	maxclients 1000;
	sendq 1M;
	recvq 8000;
}

class opers {
	pingfreq 90;
	maxclients 50;
	sendq 1M;
	recvq 8000;
}

class servers {
	pingfreq 60;
	connfreq 15;
	maxclients 10;
	sendq 20M;
}

allow {
	mask *;
	class clients;
	maxperip 100;
}

listen {
	ip 127.0.0.1;
	port 6667;
}

listen {
	ip 127.0.0.1;
	port 6697;
	options { tls; }
}

drpass {
	restart "slftp-test";
	die "slftp-test";
}

log {
	source { all; }
	destination {
		file "ircd.log" { maxsize 10M; }
	}
}

set {
	network-name "slFtpTest";
	default-server "irc.slftp.test";
	services-server "services.slftp.test";
	help-channel "#help";
	kline-address "test@slftp.test";
	cloak-prefix "test";
	/* not secret: the server only listens on 127.0.0.1 */
	cloak-keys {
		"aB3dE6gH9jK2mN5pQ8sT1vW4yZ7cF0hL3nR6uX9bD2fJ5kM8qS1tV4wY7zA0eG3iO6lP9oU2rC5xB8nK";
		"zY8xW5vU2tS9rQ6pO3nM0lK7jI4hG1fE8dC5bA2zQ9wE6rT3yU0iO7pA4sD1fG8hJ5kL2zX9cV6bN3mQ";
		"Qw1Er2Ty3Ui4Op5As6Df7Gh8Jk9Lz0Xc1Vb2Nm3Qa4Ws5Ed6Rf7Tg8Yh9Uj0Ik1Ol2Pz3Xs4Cd5Vf6BgT7nH8";
	}
	anti-flood {
		everyone {
			connect-flood 100:10;
		}
		known-users {
			lag-penalty 1;
			lag-penalty-bytes 0;
		}
		unknown-users {
			lag-penalty 1;
			lag-penalty-bytes 0;
		}
	}
}
